name: Sync Instagram reels

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: # manual run button

permissions:
  contents: write # allow committing reels.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Persist the auto-refreshed token between runs so it never expires
      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: .sync-cache.json
          key: sync-reels-token-${{ github.run_id }}
          restore-keys: |
            sync-reels-token-

      - name: Sync reels
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node scripts/sync-reels.mjs

      - name: Commit updated reels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/reels.json; then
            echo "No changes — skipping commit"
          else
            git add src/data/reels.json
            git commit -m "Update Instagram reels to latest $(date -u +%Y-%m-%d)"
            git push
          fi
